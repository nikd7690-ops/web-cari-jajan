plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// ── Muat konfigurasi dari berkas .env / .env.local ──────────────────────────
def envProps = new Properties()
def envFiles = [
    rootProject.file('native-android/.env'),
    rootProject.file('native-android/.env.local'),
    rootProject.file('.env'),
    rootProject.file('.env.local'),
    rootProject.file('local.properties')
]

envFiles.each { f ->
    if (f.exists()) {
        f.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def parts = trimmed.split('=', 2)
                def key = parts[0].trim()
                def value = parts[1].trim()
                if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                envProps.setProperty(key, value)
            }
        }
    }
}

def apiBaseUrl = System.getenv('NATIVE_API_BASE_URL') ?: envProps.getProperty('API_BASE_URL') ?: envProps.getProperty('NATIVE_API_BASE_URL') ?: envProps.getProperty('api.base.url') ?: 'https://web-cari-jajan.vercel.app'
def mapStyleUrl = System.getenv('NEXT_PUBLIC_MAP_STYLE_URL') ?: envProps.getProperty('MAP_STYLE_URL') ?: envProps.getProperty('NEXT_PUBLIC_MAP_STYLE_URL') ?: envProps.getProperty('map.style.url') ?: 'https://tiles.openfreemap.org/styles/liberty'
def appName = envProps.getProperty('APP_NAME') ?: 'Cari Jajan'
def defaultIcon = file('src/main/res/drawable/icon.png').exists() ? '@drawable/icon' : '@mipmap/ic_launcher'
def appIcon = envProps.getProperty('APP_ICON') ?: defaultIcon
def customAppId = envProps.getProperty('APPLICATION_ID') ?: 'com.carijajan.app'

android {
    namespace 'com.carijajan.app'
    compileSdk 37

    defaultConfig {
        applicationId customAppId
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "MAP_STYLE_URL", "\"${mapStyleUrl}\""

        manifestPlaceholders = [
            appName: appName,
            appIcon: appIcon
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        kotlin {
            jvmToolchain(17)
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.datastore:datastore-preferences:1.3.0'

    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'

    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'

    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
